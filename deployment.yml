apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeapp-deployment
  namespace: jenkins
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nodeapp
  template:
    metadata:
      labels:
        app: nodeapp
    spec:
      containers:
      - name: nodeapp-container
        image: hadilfares/nodeapp:latest
        ports:
        - containerPort: 3000